services:
  resolver:
    image: ghcr.io/strpc/digger:${VERSION:-latest}
    container_name: digger
    restart: unless-stopped
    build:
      context: .
      args:
        PROJECT_PATH: cmd/digger
        VERSION: ${VERSION:-latest}
        COMMIT_HASH: ${COMMIT_HASH:-unknown}
        GOARCH: ${GOARCH}
        GOOS: ${GOOS}
        CGO_ENABLED: ${CGO_ENABLED:-0}
    ports:
      - "8080:8080"
    environment:
      CACHE_TTL: ${CACHE_TTL:-300}
      PORT: ${PORT:-8080}
